general {
    lock_cmd = pidof hyprlock || hyprlock       # Avoid starting multiple hyprlock instances
    before_sleep_cmd = loginctl lock-session    # Lock screen before the system suspends
    after_sleep_cmd = hyprctl dispatch dpms on  # Ensure display turns on after system wake
}

# Listener 1: Screen Lock (Optional step before full turn-off)
listener {
    timeout = 2000                               # 10 minutes
    on-timeout = loginctl lock-session          # Lock screen command
}

# Listener 2: Turn off screen (Lights out, wakes up on mouse/key move)
listener {
    timeout = 3000                              # 10 minutes (30s after lock)
    on-timeout = hyprctl dispatch dpms off      # Command to turn off screen
    on-resume = hyprctl dispatch dpms on       # Command to turn on screen instantly on activity
}

# Listener 3: System Suspension
listener {
    timeout = 4000                               # 10 minutes
    on-timeout = systemctl suspend              # Suspend deep sleep
}